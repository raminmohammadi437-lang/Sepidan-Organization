<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Sepidan Organization | Staff Dashboard</title>
  <link rel="icon" href="assets/sepidan-logo.png">
  <link rel="stylesheet" href="styles.css?v=8">
  <script src="js/i18n.js?v=3" defer></script>
  <script src="js/dashboard.js?v=7" defer></script>
</head>
<body class="bg-mist text-ink">
  <div data-sidebar-backdrop class="fixed inset-0 z-40 hidden bg-navy/50 lg:hidden"></div>
  <aside data-sidebar class="fixed inset-y-0 left-0 z-50 flex w-[270px] -translate-x-full flex-col bg-navy px-4 py-5 text-white transition-transform lg:translate-x-0">
    <div class="flex items-center justify-between px-2"><a href="dashboard.html" class="flex items-center gap-3"><span class="brand-mark"><img src="assets/sepidan-logo.png" alt=""></span><span class="text-base font-extrabold">Staff Portal</span></a><button data-sidebar-close class="flex h-10 w-10 items-center justify-center rounded-lg hover:bg-white/10 lg:hidden" aria-label="Close navigation"><svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <nav data-sidebar-nav class="dashboard-scroll mt-8 flex-1 space-y-1 overflow-y-auto" aria-label="Dashboard navigation"></nav>
    <div class="mt-5 border-t border-white/15 pt-5"><div class="flex items-center gap-3 px-2"><span data-avatar class="flex h-10 w-10 items-center justify-center rounded-full bg-teal text-sm font-extrabold text-navy"></span><div class="min-w-0"><p data-user-name class="truncate text-sm font-bold"></p><p data-user-role class="text-xs text-white/55"></p></div></div><button data-logout class="mt-4 flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-semibold text-white/70 hover:bg-white/10 hover:text-white"><svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 17l5-5-5-5M15 12H3M13 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg>Sign out</button></div>
  </aside>

  <main class="min-h-screen lg:ml-[270px]">
    <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur">
      <div class="flex min-h-[82px] items-center gap-4 px-5 sm:px-7 lg:px-8"><button data-sidebar-open class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-slate-200 text-navy lg:hidden" aria-label="Open navigation"><svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div class="min-w-0"><h1 data-dashboard-title class="truncate text-xl font-extrabold tracking-tight text-navy sm:text-2xl"></h1><p class="mt-0.5 hidden text-sm text-muted sm:block">Sepidan Organization · Prototype data</p></div><form data-search-form class="ml-auto hidden w-full max-w-md xl:block"><label class="sr-only" for="dashboard-search">Search portal</label><div class="relative"><input id="dashboard-search" class="field min-h-10 py-2 pr-11 text-sm" type="search" placeholder="Search records and modules…"><button class="absolute inset-y-0 right-0 flex w-11 items-center justify-center text-muted hover:text-navy" aria-label="Search"><svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button></div></form><button data-language-toggle class="language-toggle ml-auto xl:ml-0" type="button">دری</button><button class="relative flex h-10 w-10 shrink-0 items-center justify-center rounded-lg text-navy hover:bg-mist" aria-label="Notifications"><svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span class="absolute right-1 top-1 h-2 w-2 rounded-full bg-teal"></span></button><span data-avatar-header class="hidden h-10 w-10 shrink-0 items-center justify-center rounded-full bg-navy text-xs font-extrabold text-white sm:flex" aria-hidden="true"></span></div>
    </header>

    <div class="space-y-5 p-5 sm:p-7 lg:p-8">
      <section data-stats class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4" aria-label="Summary"></section>
      <div class="grid gap-5 xl:grid-cols-[1.45fr_0.85fr]">
        <section class="surface-panel min-w-0 overflow-hidden"><header class="flex items-center justify-between border-b border-slate-200 px-5 py-4"><h2 data-table-title class="font-extrabold text-navy"></h2><button class="text-xs font-bold text-teal hover:text-[#009c88]">View all</button></header><div class="overflow-x-auto"><table class="w-full border-collapse"><thead data-table-head class="bg-slate-50"></thead><tbody data-table-body></tbody></table></div></section>
        <section class="surface-panel p-5"><div class="flex items-center justify-between"><h2 class="font-extrabold text-navy">Recent activity</h2><button class="text-xs font-bold text-teal">View all</button></div><ul data-activity class="mt-2"></ul></section>
      </div>
      <div class="grid gap-5 xl:grid-cols-[1.3fr_1fr]">
        <section class="surface-panel p-5"><div class="flex items-center justify-between"><div><h2 data-chart-title class="font-extrabold text-navy"></h2><p class="mt-1 text-xs text-muted">Seven-month trend</p></div><select class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-navy"><option>This semester</option></select></div><div class="chart-grid mt-6 flex h-52 items-end gap-3 border-b border-slate-200 px-2 pt-5" data-chart aria-label="Operational trend chart"></div></section>
        <section class="surface-panel p-5"><h2 class="font-extrabold text-navy">Quick actions</h2><div data-quick-actions class="mt-5 grid gap-3 sm:grid-cols-2"></div></section>
      </div>
    </div>
  </main>
</body>
</html>
